
name: Build Android APK v1.4

on:
  push:
    branches:
      - build-new-apk
    paths:
      - '.github/workflows/build-apk.yml'
      - 'MZ_SOURCE_v1.4.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: build-new-apk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail

          test -f MZ_SOURCE_v1.4.zip

          EXPECTED_SHA256="125077b7fe2ab263437ae47406dd2c4f4758ff6cd410a187148eadddadb0679b"
          ACTUAL_SHA256="$(sha256sum MZ_SOURCE_v1.4.zip | awk '{print $1}')"

          echo "Expected SHA256: ${EXPECTED_SHA256}"
          echo "Actual SHA256:   ${ACTUAL_SHA256}"

          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "::error::Source archive SHA256 mismatch"
            exit 1
          fi

          echo "Source archive SHA256 verified."

      - name: Extract source and identify Android project root
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source
          unzip -q MZ_SOURCE_v1.4.zip -d source

          echo "Extracted source files:"
          find source -maxdepth 3 -type f | sort | head -200

          mapfile -t SETTINGS_FILES < <(
            find source -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print | sort
          )

          if [[ "${#SETTINGS_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one settings.gradle(.kts); found ${#SETTINGS_FILES[@]}"
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"

          if [[ ! -f "${PROJECT_DIR}/app/build.gradle" && \
                ! -f "${PROJECT_DIR}/app/build.gradle.kts" ]]; then
            echo "::error::App module build.gradle(.kts) was not found"
            exit 1
          fi

          if [[ ! -f "${PROJECT_DIR}/build.gradle" && \
                ! -f "${PROJECT_DIR}/build.gradle.kts" ]]; then
            echo "::error::Root build.gradle(.kts) was not found"
            exit 1
          fi

          test -f "${PROJECT_DIR}/gradle.properties"
          test -f "${PROJECT_DIR}/BUILD_GUIDE.md"

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"
          echo "Resolved Android project: ${PROJECT_DIR}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: false

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --version
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Locate and verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          EXPECTED_APP_ID: ir.modiriyatzendegi.test
          EXPECTED_VERSION_NAME: 1.0.0
          EXPECTED_VERSION_CODE: '82'
        run: |
          set -euo pipefail

          mapfile -t APK_FILES < <(find . -type f -path '*/build/outputs/apk/debug/*.apk' | sort)

          if [[ "${#APK_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Debug APK; found ${#APK_FILES[@]}"
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          fi

          APK_PATH="${APK_FILES[0]}"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"

          if [[ ! -x "${AAPT}" ]]; then
            echo "::error::aapt was not found"
            exit 1
          fi

          BADGING="$("${AAPT}" dump badging "${APK_PATH}")"

          echo "${BADGING}"

          APP_ID="$(printf '%s\n' "${BADGING}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "${BADGING}" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "${BADGING}" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"

          echo "Detected application ID: ${APP_ID}"
          echo "Detected version name: ${VERSION_NAME}"
          echo "Detected version code: ${VERSION_CODE}"

          [[ "${APP_ID}" == "${EXPECTED_APP_ID}" ]] || {
            echo "::error::Application ID mismatch"
            exit 1
          }

          [[ "${VERSION_NAME}" == "${EXPECTED_VERSION_NAME}" ]] || {
            echo "::error::Version name mismatch"
            exit 1
          }

          [[ "${VERSION_CODE}" == "${EXPECTED_VERSION_CODE}" ]] || {
            echo "::error::Version code mismatch"
            exit 1
          }

          mkdir -p "${GITHUB_WORKSPACE}/apk-output"
          cp "${APK_PATH}" "${GITHUB_WORKSPACE}/apk-output/Modiriat-Zendegi-v1.0.0-debug.apk"

          sha256sum "${GITHUB_WORKSPACE}/apk-output/Modiriat-Zendegi-v1.0.0-debug.apk"

          echo "APK verification passed."

      - name: Create APK package
        shell: bash
        run: |
          set -euo pipefail

          cd apk-output

          sha256sum Modiriat-Zendegi-v1.0.0-debug.apk > SHA256SUMS.txt

          zip -q Modiriat-Zendegi-v1.0.0-debug-package.zip \
            Modiriat-Zendegi-v1.0.0-debug.apk \
            SHA256SUMS.txt

          cd "${GITHUB_WORKSPACE}"

          mkdir -p build-report

          cat > build-report/BUILD_REPORT.txt <<'EOF'
          Project: Modiriat Zendegi 2.0
          Source: MZ_SOURCE_v1.4.zip
          Branch: build-new-apk
          Build type: Debug
          Application ID: ir.modiriyatzendegi.test
          Version name: 1.0.0
          Version code: 82

          Build and APK identity verification are performed by this workflow.

          Unit tests: NOT RUN unless separately configured and executed.
          Instrumentation tests: NOT RUN.
          Device tests: NOT RUN.
          Runtime migration tests: NOT RUN.
          Keystore and restore tests: NOT RUN.

          A successful build does not establish device/runtime correctness.
          EOF

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Modiriat-Zendegi-v1.0.0-debug
          path: |
            apk-output/Modiriat-Zendegi-v1.0.0-debug.apk
            apk-output/Modiriat-Zendegi-v1.0.0-debug-package.zip
            apk-output/SHA256SUMS.txt
            build-report/BUILD_REPORT.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Android APK Build"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Source: \`MZ_SOURCE_v1.4.zip\`"
            echo "- Application ID: \`ir.modiriyatzendegi.test\`"
            echo "- Version: \`1.0.0 (82)\`"
            echo "- Unit tests: NOT RUN unless separately configured"
            echo "- Instrumentation tests: NOT RUN"
            echo "- Device/runtime tests: NOT RUN"
            echo ""
            echo "Build success does not prove device/runtime behavior."
          } >> "${GITHUB_STEP_SUMMARY}"
