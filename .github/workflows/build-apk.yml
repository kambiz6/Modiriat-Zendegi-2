
name: Build Android APK - MZ_SOURCE v1.2

on:
  workflow_dispatch:
  push:
    branches:
      - build-new-apk
    paths:
      - "MZ_SOURCE_v1.2.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: mz-source-v1-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Package Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare package directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            package/01_APK \
            package/02_SOURCE_ARCHIVE \
            package/03_EXTRACTED_SOURCE \
            package/04_BUILD_ENVIRONMENT \
            package/05_BUILD_LOGS \
            package/06_TEST_REPORTS \
            package/07_CHANGELOG \
            package/08_BUILD_METADATA \
            package/09_HASHES \
            package/10_REBUILD_GUIDE \
            package/11_OPTIONAL_ARTIFACTS \
            source \
            dist

      - name: Validate and extract source archive
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="MZ_SOURCE_v1.2.zip"

          test -s "$SOURCE_ZIP"
          unzip -tq "$SOURCE_ZIP"

          cp "$SOURCE_ZIP" package/02_SOURCE_ARCHIVE/

          unzip -q "$SOURCE_ZIP" -d source

          mapfile -t SETTINGS_FILES < <(
            find source -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print
          )

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Android project settings file."
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app module Gradle file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle.properties" ]; then
            echo "ERROR: gradle.properties not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          cp -a "$PROJECT_DIR/." package/03_EXTRACTED_SOURCE/

      - name: Record source configuration
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "SOURCE ARCHIVE: $SOURCE_ZIP"
            echo "PROJECT DIRECTORY: $PROJECT_DIR"
            echo

            for FILE in \
              SOURCE_VERSION.txt \
              RELEASE_VERSION.txt \
              gradle.properties \
              README_GITHUB_BUILD_FA.txt \
              README_SOURCE_29_TEST_FA.txt
            do
              echo "===== $FILE ====="

              if [ -f "$PROJECT_DIR/$FILE" ]; then
                cat "$PROJECT_DIR/$FILE"
              else
                echo "Not found"
              fi

              echo
            done

            echo "===== APP GRADLE CONFIGURATION ====="

            if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
              cat "$PROJECT_DIR/app/build.gradle.kts"
            else
              cat "$PROJECT_DIR/app/build.gradle"
            fi

          } > package/08_BUILD_METADATA/source-configuration.txt

      - name: Check Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          fi

          if ! grep -Eq \
            'compileSdk(Version)?[[:space:]]*(=|\\()?35' \
            "$APP_GRADLE"; then
            echo "WARNING: compileSdk 35 was not confirmed by a simple source check."
            echo "Gradle build will determine actual compatibility."
          fi

          {
            echo "Installed Android platform: android-35"
            echo "Installed build tools: 35.0.0"
            echo "Java version: 17"
            echo "Gradle version: 8.7"
          } > package/04_BUILD_ENVIRONMENT/build-environment.txt

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            -p "$PROJECT_DIR" \
            assembleDebug 2>&1 \
            | tee package/05_BUILD_LOGS/gradle-build.log

      - name: Locate and validate APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found."
            exit 1
          fi

          mapfile -t APK_FILES < <(
            find "$APK_DIR" -type f -name '*.apk' -print | sort
          )

          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one APK."
            echo "Found: ${#APK_FILES[@]}"
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          fi

          APK="${APK_FILES[0]}"

          test -s "$APK"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -x "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"

          printf '%s\n' "$BADGING" \
            > package/08_BUILD_METADATA/apk-badging.txt

          IDENTITY="$(printf '%s\n' "$BADGING" | \
            sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1|\2|\3/p" \
            | head -n 1)"

          if [ -z "$IDENTITY" ]; then
            echo "ERROR: Could not read APK identity."
            exit 1
          fi

          APP_ID="$(echo "$IDENTITY" | cut -d'|' -f1)"
          VERSION_CODE="$(echo "$IDENTITY" | cut -d'|' -f2)"
          VERSION_NAME="$(echo "$IDENTITY" | cut -d'|' -f3)"

          VERSION_SAFE="$(printf '%s' "$VERSION_NAME" | \
            tr -c 'A-Za-z0-9._-' '_')"

          APK_FILE="$(basename "$APK")"

          cp "$APK" package/01_APK/

          {
            echo "Build result: SUCCESS"
            echo "Application ID: $APP_ID"
            echo "Version name: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "APK filename: $APK_FILE"
            echo "APK source: $APK"
          } > package/08_BUILD_METADATA/build-report.txt

          {
            echo "APP_ID=$APP_ID"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_SAFE=$VERSION_SAFE"
            echo "APK_FILE=$APK_FILE"
          } >> "$GITHUB_ENV"

      - name: Record test status
        shell: bash
        run: |
          set -euo pipefail

          cat > package/06_TEST_REPORTS/test-status.txt <<EOF
          Source archive validation: PASSED
          Source extraction: PASSED
          Gradle build: PASSED
          APK generation: PASSED
          APK metadata extraction: PASSED

          Application ID: $APP_ID
          Version name: $VERSION_NAME
          Version code: $VERSION_CODE

          Unit tests: NOT RUN
          Instrumentation tests: NOT RUN
          Physical device installation: NOT RUN
          Runtime functional tests: NOT RUN

          Build type: DEBUG
          Release signing: NOT PERFORMED
          EOF

      - name: Copy changelog
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/CHANGELOG.md" ]; then
            cp "$PROJECT_DIR/CHANGELOG.md" package/07_CHANGELOG/
          elif [ -f "$PROJECT_DIR/CHANGELOG_FA.txt" ]; then
            cp "$PROJECT_DIR/CHANGELOG_FA.txt" package/07_CHANGELOG/
          else
            echo "No changelog found." \
              > package/07_CHANGELOG/CHANGELOG_STATUS.txt
          fi

      - name: Create rebuild guide
        shell: bash
        run: |
          set -euo pipefail

          cat > package/10_REBUILD_GUIDE/REBUILD_GUIDE.txt <<EOF
          REBUILD GUIDE

          Source archive: $SOURCE_ZIP

          Java: 17
          Gradle: 8.7
          Android SDK: 35
          Build tools: 35.0.0

          Extract the source archive.
          Open the Android project directory.
          Run:

          gradle --no-daemon assembleDebug

          Build type: DEBUG
          Release signing: NOT PERFORMED

          Application ID: $APP_ID
          Version name: $VERSION_NAME
          Version code: $VERSION_CODE

          Device installation and runtime tests must be performed separately.
          EOF

      - name: Record optional artifacts
        shell: bash
        run: |
          set -euo pipefail

          cat > package/11_OPTIONAL_ARTIFACTS/CONTENTS_STATUS.txt <<'EOF'
          No device screenshots were generated.
          No runtime diagnostics were generated.
          No private signing keys or passwords are included.
          EOF

      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Source archive: $SOURCE_ZIP"
            echo "Application ID: $APP_ID"
            echo "Version name: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "APK filename: $APK_FILE"
            echo "Build type: DEBUG"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Timestamp UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > package/08_BUILD_METADATA/release-metadata.txt

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd package

            find . -type f \
              ! -path './09_HASHES/SHA256SUMS.txt' \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > package/09_HASHES/SHA256SUMS.txt

      - name: Create final package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="Modiriat-Zendegi-${VERSION_SAFE}-FULL-PACKAGE.zip"

          zip -qr "dist/$ZIP_NAME" package

          sha256sum "dist/$ZIP_NAME" \
            > "dist/$ZIP_NAME.sha256"

          echo "PACKAGE_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Modiriat-Zendegi-MZ_SOURCE-v1.2-FULL-PACKAGE
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Modiriat Zendegi - Build Summary"
            echo
            echo "- Source: MZ_SOURCE_v1.2.zip"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"

            if [ -n "${APP_ID:-}" ]; then
              echo "- Application ID: $APP_ID"
              echo "- Version: $VERSION_NAME"
              echo "- Version code: $VERSION_CODE"
            fi

            if [ -n "${PACKAGE_ZIP:-}" ]; then
              echo "- Package: $PACKAGE_ZIP"
            fi

            echo
            echo "Device installation and runtime tests were not performed."
          } >> "$GITHUB_STEP_SUMMARY"
