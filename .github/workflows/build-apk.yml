
name: Build Android APK - SOURCE-28 FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - build-new-apk
    paths:
      - "MZ_SOURCE-28_FIXED.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: source-28-fixed-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: دریافت فایل‌های مخزن
        uses: actions/checkout@v4

      - name: نصب جاوا 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: نصب ابزارهای پایه اندروید
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: پذیرش مجوزها و نصب بسته‌های Android SDK
        shell: bash
        run: |
          set -euo pipefail

          printf 'y\n%.0s' {1..100} > licenses.txt
          sdkmanager --licenses < licenses.txt
          rm -f licenses.txt

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: تنظیم آینه Maven Central با مسیر جایگزین
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/maven-central-mirror.gradle" <<'GRADLE'
          def central = ~/^https:\/\/(repo\.maven\.apache\.org|repo1\.maven\.org)\/maven2\/?/
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def fallback = 'mavenCentralBehindMirror'

          def addFallback = { RepositoryHandler repositories ->
              repositories.maven {
                  name = fallback
                  url = 'https://repo.maven.apache.org/maven2/'
              }
          }

          def toMirror = { RepositoryHandler repositories ->
              def hasFallback = false

              repositories.all { repository ->
                  if (repository.name == fallback) {
                      return
                  }

                  if (repository instanceof MavenArtifactRepository) {
                      def url = repository.url.toString()

                      if (url =~ central) {
                          repository.url = url.replaceFirst(central, mirror)

                          if (!hasFallback) {
                              hasFallback = true
                              addFallback(repositories)
                              return
                          }
                      }
                  }

                  def last = repositories.findByName(fallback)

                  if (hasFallback && !repositories.last().is(last)) {
                      repositories.remove(last)
                      repositories.add(last)
                  }
              }
          }

          beforeSettings { settings ->
              toMirror(settings.buildscript.repositories)
              toMirror(settings.pluginManagement.repositories)
              toMirror(settings.dependencyResolutionManagement.repositories)
          }

          settingsEvaluated { settings ->
              if (settings.pluginManagement.repositories.isEmpty()) {
                  settings.pluginManagement.repositories {
                      maven { url = mirror }
                      addFallback(delegate)
                      gradlePluginPortal()
                  }
              }
          }

          allprojects { project ->
              toMirror(project.buildscript.repositories)
              toMirror(project.repositories)
          }
          GRADLE

          test -s "$RUNNER_TEMP/maven-central-mirror.gradle"
          echo "Maven Central mirror init script created."

      - name: بررسی و استخراج SOURCE-28 FIXED
        shell: bash
        run: |
          set -euo pipefail

          test -s MZ_SOURCE-28_FIXED.zip
          unzip -tq MZ_SOURCE-28_FIXED.zip

          mkdir -p source
          unzip -q MZ_SOURCE-28_FIXED.zip -d source

          SETTINGS_FILE=$(find source -maxdepth 7 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          test -n "$SETTINGS_FILE"

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Resolved Android project: $PROJECT_DIR"

      - name: ثبت مشخصات ساخت
        shell: bash
        run: |
          set -euo pipefail

          echo "Source package: SOURCE-28 FIXED"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Project directory: $PROJECT_DIR"

          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \) -print

      - name: ساخت APK آزمایشی
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --init-script "$RUNNER_TEMP/maven-central-mirror.gradle" \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: کنترل وجود APK
        shell: bash
        run: |
          set -euo pipefail

          find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .

      - name: ذخیره APK ساخته‌شده
        uses: actions/upload-artifact@v4
        with:
          name: Modiriat-Zendegi-SOURCE-28-FIXED-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
