
name: Build Android APK v1.5

on:
  push:
    branches:
      - build-new-apk
    paths:
      - 'MZ_SOURCE_v1.5.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f MZ_SOURCE_v1.5.zip
          sha256sum MZ_SOURCE_v1.5.zip
          unzip -t MZ_SOURCE_v1.5.zip

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          unzip -q MZ_SOURCE_v1.5.zip -d source
          echo "Extracted files:"
          find source -maxdepth 3 -type f | head -100

          ROOT="$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)"
          test -n "$ROOT"
          PROJECT_ROOT="$(dirname "$ROOT")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Verify and patch temporary build configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          root = pathlib.Path(os.environ["PROJECT_ROOT"])
          gradle_files = list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts"))

          for path in gradle_files:
              text = path.read_text(encoding="utf-8")
              original = text

              text = re.sub(r'compileSdk\s*=\s*35\b', 'compileSdk = 36', text)
              text = re.sub(r'compileSdk\s+35\b', 'compileSdk 36', text)

              text = text.replace('8.6.1', '8.10.0')
              text = text.replace('2.0.20', '2.2.10')

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print(f"Patched temporary file: {path}")

          print("Temporary build configuration check completed.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT" -path '*/build/outputs/apk/debug/*.apk' -type f | head -1)"
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/management-life-v1.5-debug.apk"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Verify APK package information
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apk-output/management-life-v1.5-debug.apk"
          aapt dump badging "$APK" | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Management-Life-v1.5-Debug-APK
          path: apk-output/management-life-v1.5-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "## Management Life 2.0 - v1.5" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: MZ_SOURCE_v1.5.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: build-new-apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Build result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
