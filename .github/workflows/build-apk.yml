
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/0.23.25
    paths:
      - 'MZ_02325_Branch33_Stage6_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Extract Android project
        run: |
          unzip -q MZ_02325_Branch33_Stage6_Source.zip -d source
          test -f source/Modiriat_Zendegi_2_0_v0_23_24/settings.gradle.kts

      - name: Fix Java target to 17
        working-directory: source/Modiriat_Zendegi_2_0_v0_23_24
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          needle = '        versionName = "0.23.25"\n    }\n}'
          replacement = '''        versionName = "0.23.25"
          }
          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          }'''

          if needle not in s:
              raise SystemExit("Expected Gradle configuration was not found")

          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Verify JVM target
        working-directory: source/Modiriat_Zendegi_2_0_v0_23_24
        run: |
          grep -n -A 4 'compileOptions' app/build.gradle.kts

      - name: Show Kotlin source around errors
        run: |
          FILE="$(find source -name MainActivity.kt -print -quit)"
          test -n "$FILE"
          echo "Source file: $FILE"
          nl -ba "$FILE" | sed -n '1120,1185p'

      - name: Build debug APK
        working-directory: source/Modiriat_Zendegi_2_0_v0_23_24
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modiriat-Zendegi-2-debug-apk
          path: source/Modiriat_Zendegi_2_0_v0_23_24/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
